name: task_notes_app
description: Portfolio-grade offline-first task and notes manager.
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  dartz: ^0.10.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
