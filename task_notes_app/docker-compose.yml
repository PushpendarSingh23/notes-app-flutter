version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: task_notes_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootsecretpassword
      MYSQL_DATABASE: task_notes_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_notes_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootsecretpassword
      DB_NAME: task_notes_db
      JWT_ACCESS_SECRET: production_secure_access_secret_key_256_bit
      JWT_REFRESH_SECRET: production_secure_refresh_secret_key_256_bit
    depends_on:
      - mysql

volumes:
  mysql_data:
